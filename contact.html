<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | Corina Garcin</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f1e8;
            color: #111;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .contact-container {
            width: 100%;
            max-width: 700px;
        }

        .back {
            display: inline-block;
            margin-bottom: 35px;
            color: #111;
            text-decoration: none;
            font-weight: bold;
        }

        .back:hover {
            text-decoration: underline;
        }

        h1 {
            font-size: clamp(3rem, 9vw, 6rem);
            line-height: 0.9;
            margin-bottom: 20px;
            letter-spacing: -4px;
        }

        .intro {
            font-size: 18px;
            margin-bottom: 40px;
            line-height: 1.5;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        label {
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        input,
        textarea {
            width: 100%;
            border: none;
            border-bottom: 2px solid #111;
            background: transparent;
            padding: 12px 0;
            font-size: 17px;
            outline: none;
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            border-bottom-color: #ff2d95;
        }

        button {
            margin-top: 15px;
            background: #ff2d95;
            color: #111;
            border: 2px solid #111;
            border-radius: 999px;
            padding: 17px 30px;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            align-self: flex-start;
            transition: 0.2s ease;
        }

        button:hover {
            background: #111;
            color: white;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>

    <main class="contact-container">

        <a href="index.html" class="back">← BACK TO PORTFOLIO</a>

        <h1>SAY HELLO.</h1>

        <p class="intro">
            Have a question, opportunity, or just want to connect?
            Send me a message below.
        </p>

       <form action="https://formspree.io/f/mgaowjge" method="POST">

            <div>
                <label for="name">NAME</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Your name"
                    required
                >
            </div>

            <div>
                <label for="email">EMAIL</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Your email"
                    required
                >
            </div>

            <div>
                <label for="message">MESSAGE</label>
                <textarea
                    id="message"
                    name="message"
                    placeholder="Write your message here..."
                    required
                ></textarea>
            </div>

            <button type="submit">
                SEND MESSAGE →
            </button>

        </form>

    </main>

</body>
</html>
